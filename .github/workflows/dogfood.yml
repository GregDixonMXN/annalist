name: dogfood agent
on:
  workflow_dispatch:
    inputs:
      task:
        description: Agent task prompt
        required: false
        default: Run `zig build test` and fix any failure without changing public behavior. Do not commit.
jobs:
  agent:
    runs-on: ubuntu-24.04
    env:
      ANNALIST_TASK: ${{ inputs.task }}
    steps:
      - uses: actions/checkout@v4
      - name: Require agent credential
        shell: bash
        env:
          META_API_KEY: ${{ secrets.META_API_KEY }}
        run: |
          set -eu
          [ -n "$META_API_KEY" ] || {
            echo "Create a key at https://dev.meta.ai dashboard -> API keys, add it as a META_API_KEY repo secret (Settings -> Secrets and variables -> Actions), then re-dispatch." >&2
            exit 1
          }
      - name: Install Muse Code
        shell: bash
        run: curl -fsSL https://dev.meta.ai/install.sh | sh
      - uses: ./.github/actions/annalist-run
        with:
          command: muse exec "$ANNALIST_TASK"
          policy_file: examples/agent-pr/annalist.policy.toml
        env:
          META_API_KEY: ${{ secrets.META_API_KEY }}
